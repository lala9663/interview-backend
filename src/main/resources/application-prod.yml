# 운영: Oracle + Redis Sentinel. 기본값을 두지 않는다(환경변수가 없으면 뜨지 않는다).
# INTERNAL_API_KEY, ROOM_TICKET_SECRET 이 개발용 기본값이면 시작할 때 거부한다(auth.SecretsGuard).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
  redis:
    password: ${REDIS_PASSWORD:}
    timeout: 3s
    sentinel:
      master: ${REDIS_SENTINEL_MASTER}
      nodes: ${REDIS_SENTINEL_NODES}
      password: ${REDIS_SENTINEL_PASSWORD:}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  token-store:
    type: redis
  agent:
    mode: http
    base-url: ${AGENT_BASE_URL}
    ws-base-url: ${AGENT_WS_BASE_URL}

logging:
  level:
    root: INFO
