# 모든 프로파일의 공통 설정. 프로파일별 차이는 application-<profile>.yml 에 둔다.
#   local : H2(Oracle 호환 모드, 파일 DB) + 메모리 토큰 저장소 + dev-login + 시드 데이터
#   dev   : Oracle + Redis Sentinel (개발 서버)
#   prod  : Oracle + Redis Sentinel (운영)
#   ad    : AD SSO 자리 (dev/prod 와 함께 켠다. 예: SPRING_PROFILES_ACTIVE=prod,ad)
# 환경변수 목록은 README.md 의 표를 본다.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: interview-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      repositories:
        enabled: false

app:
  # 업무 시간대. DB 의 시각은 이 시간대의 값으로 저장된다.
  time-zone: Asia/Seoul

  security:
    # access 토큰 서명 키(HS256, 32바이트 이상). local 만 기본값이 있다.
    jwt-secret: ${JWT_SECRET:}
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 1209600
    # 백엔드 ↔ Agent 내부 API 의 X-Internal-Key (양방향 같은 값)
    internal-key: ${INTERNAL_API_KEY:dev-internal-key}
    # 방 입장권 서명 키(HS256). Agent 와 공유한다.
    room-ticket-secret: ${ROOM_TICKET_SECRET:dev-room-ticket-secret-change-me-32bytes!!}
    room-ticket-ttl-seconds: 300
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # refresh 토큰 저장소: memory | redis
  token-store:
    type: memory

  agent:
    # http = 실제 Agent 호출, fake = 가짜 구현(Agent 없이 단독 실행)
    mode: ${AGENT_MODE:http}
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    ws-base-url: ${AGENT_WS_BASE_URL:ws://localhost:8000}
    connect-timeout-seconds: 3
    health-timeout-seconds: 2
    finalize-timeout-seconds: 30
    stats-timeout-seconds: 3
    # 트랙별 제한 시간(초)
    new-grad:
      briefing-seconds: 120
      evaluation-seconds: 120
      report-seconds: 120
    experienced:
      briefing-seconds: 300
      evaluation-seconds: 600
      report-seconds: 3600

  jobs:
    core-pool-size: 8
    max-pool-size: 24
    queue-capacity: 2000
    # 재시작 때 끝나지 않은 작업: fail | restart
    recovery: fail
    instance-id: ${APP_INSTANCE_ID:}

  # 운영 현황판(/admin/operations)의 주의 기준(분, 큐 깊이)
  operations:
    not-started-minutes: 5
    overtime-minutes: 5
    silent-minutes: 3
    stt-backlog-depth: 5

  briefing:
    jd-question-count: 4
    resume-question-count: 6
    question-bank-limit: 30

  matching:
    strategy: jd
    interviewers-per-interview: 2
    # 면접이 없는 면접자에게 만들어 줄 면접(1차, 2차 순). 신입도 경력도 직무 → 인성.
    new-grad-plan: [JOB, PERSONALITY]
    experienced-plan: [JOB, PERSONALITY]

  # 실시간 기능(녹음, 전사, 꼬리질문 제안, 면접 뒤 AI 평가와 보고서)을 쓰는 트랙. Interview 응답의 liveEnabled.
  live:
    new-grad-enabled: false
    experienced-enabled: true

  evaluation:
    # AI 참고 평가(GET /interviews/{id}/ai-evaluation)를 볼 수 있는 사람: ADMIN | ALL
    ai-visible-to: ADMIN

  upload:
    # 운영에서 재배포 없이 고치려면 file:/경로/excel-mapping.yml 로 바꾼다.
    mapping-location: ${EXCEL_MAPPING_LOCATION:classpath:excel-mapping.yml}
    max-rows: 5000

  # 기능 플래그. 덜 끝난 기능은 플래그 뒤에 두고 dev 에 합친다(AGENTS.md).
  features:
    # 자동 매칭 직후 새 면접의 브리핑 작업을 자동으로 접수한다.
    auto-briefing-on-match: true

  seed:
    enabled: false

logging:
  level:
    # JSON 컬럼(JsonNode)에 대한 경고(HHH000481)는 무해하다. JsonNode 의 구현 클래스는 equals 를 갖고 있다.
    org.hibernate.type.descriptor.java.JavaTypeDescriptorRegistry: ERROR
