# 로컬 개발: Oracle·Redis·Agent 없이 뜬다.
spring:
  datasource:
    # H2 를 Oracle 호환 모드로 쓴다. 파일은 ./data/ 아래(지우면 시드부터 다시 시작).
    url: jdbc:h2:file:./data/interview;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    # Oracle 호환 모드의 H2 는 "limit ?" 를 받지 않아 페이지 문법만 바꾼 방언을 쓴다.
    database-platform: com.interview.common.H2OracleModeDialect
    hibernate:
      ddl-auto: update

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-jwt-secret-change-me-at-least-32-bytes!!}
  token-store:
    type: memory
  seed:
    # 가짜 데이터(사용자 6명, 채용 2개, 면접자 24명 ...)를 빈 DB 에 넣는다.
    enabled: true
    # 시드 면접의 날짜를 서버를 띄운 날로 옮긴다("오늘 면접"이 항상 보이게).
    shift-dates-to-today: true

logging:
  level:
    com.interview: INFO
